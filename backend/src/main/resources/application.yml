server:
  port: 8080

spring:
  application:
    name: gym-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/gym_manage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:gym123}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-docker-compose}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}

